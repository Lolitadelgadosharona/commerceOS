name: commerce-os

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: commerce_os
      POSTGRES_USER: commerce_os
      POSTGRES_PASSWORD: commerce_os
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce_os -d commerce_os"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    command: ["sh", "-c", "alembic upgrade head && uvicorn apps.api.main:app --host 0.0.0.0 --port 8000"]
    environment:
      COMMERCE_OS_ENVIRONMENT: development
      COMMERCE_OS_DATABASE_URL: postgresql+psycopg://commerce_os:commerce_os@postgres:5432/commerce_os
      COMMERCE_OS_REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    command: ["python", "-m", "apps.worker.main"]
    environment:
      COMMERCE_OS_ENVIRONMENT: development
      COMMERCE_OS_DATABASE_URL: postgresql+psycopg://commerce_os:commerce_os@postgres:5432/commerce_os
      COMMERCE_OS_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      COMMERCE_OS_API_TOKEN: ${COMMERCE_OS_API_TOKEN:-}
      COMMERCE_OS_ORGANIZATION_ID: ${COMMERCE_OS_ORGANIZATION_ID:-}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => { if (!r.ok) process.exit(1) })"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  redis_data:
