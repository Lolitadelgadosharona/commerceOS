[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "commerce-os"
version = "0.1.0"
description = "Commerce OS modular-monolith foundation"
requires-python = ">=3.11,<3.14"
dependencies = [
  "alembic==1.19.1",
  "fastapi==0.141.1",
  "pydantic-settings==2.15.0",
  "psycopg[binary]==3.3.4",
  "redis==8.1.0",
  "sqlalchemy==2.0.51",
  "uvicorn[standard]==0.52.1",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.10.0",
  "mypy==1.15.0",
  "pip-audit==2.10.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.2",
]

[tool.setuptools]
package-dir = {"" = "packages/backend"}

[tool.setuptools.packages.find]
where = ["packages/backend"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/backend"]
pythonpath = ["packages/backend", "."]
addopts = "-ra --strict-markers"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["commerce_os", "apps.api", "apps.worker"]
exclude = ["alembic"]
plugins = ["pydantic.mypy"]
